<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" style="background-color: #ffffff; width: 100%; height: 100%; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <defs>
        <!-- Isometric Background Grid Pattern -->
        <pattern id="isoGrid" width="120" height="69.282" patternUnits="userSpaceOnUse">
            <path d="M 0,34.641 L 60,0 L 120,34.641 L 60,69.282 Z" fill="none" stroke="#f0f0f0" stroke-width="1.5"/>
        </pattern>

        <!-- Energy Glow Filter -->
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="8" result="blur1" />
            <feGaussianBlur stdDeviation="4" result="blur2" />
            <feMerge>
                <feMergeNode in="blur1"/>
                <feMergeNode in="blur2"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Shadow Blur Filter -->
        <filter id="shadowBlur" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur stdDeviation="15" />
        </filter>

        <!-- Gradients for Clay Render Shading -->
        <linearGradient id="floorGrad" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#f8f8f8"/>
            <stop offset="100%" stop-color="#ffffff"/>
        </linearGradient>

        <linearGradient id="leftWallGrad" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#e2e2e2"/>
            <stop offset="100%" stop-color="#f0f0f0"/>
        </linearGradient>

        <linearGradient id="rightWallGrad" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#d4d4d4"/>
            <stop offset="100%" stop-color="#e8e8e8"/>
        </linearGradient>

        <linearGradient id="elevLeftGrad" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#ededed"/>
            <stop offset="100%" stop-color="#fcfcfc"/>
        </linearGradient>

        <linearGradient id="elevRightGrad" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#dedede"/>
            <stop offset="100%" stop-color="#eeeeee"/>
        </linearGradient>

        <linearGradient id="airGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#44B6E5" stop-opacity="0.0"/>
            <stop offset="100%" stop-color="#44B6E5" stop-opacity="0.85"/>
        </linearGradient>
    </defs>

    <!-- Faint Isometric White Grid Background -->
    <rect width="1080" height="1920" fill="url(#isoGrid)"/>

    <!-- ================= TYPOGRAPHY (TOP) ================= -->
    <g transform="translate(0, 40)">
        <text x="540" y="100" font-size="44" font-weight="800" fill="#1a1a1a" text-anchor="middle" letter-spacing="-0.5">
            First, the elevator shaft was a <tspan fill="#44B6E5">sealed tube</tspan>,
        </text>
        <text x="540" y="160" font-size="44" font-weight="800" fill="#1a1a1a" text-anchor="middle" letter-spacing="-0.5">
            like a giant syringe.
        </text>

        <text x="540" y="250" font-size="36" font-weight="600" fill="#666666" text-anchor="middle" letter-spacing="-0.25">
            So as the elevator fell, it acted like a <tspan fill="#44B6E5">piston</tspan>
        </text>
        <text x="540" y="300" font-size="36" font-weight="600" fill="#666666" text-anchor="middle" letter-spacing="-0.25">
            pushing air down the shaft.
        </text>
    </g>

    <!-- ================= 3D ISOMETRIC SCENE ================= -->
    <g transform="translate(0, 110)">
        
        <!-- Floor Drop Shadow -->
        <polygon points="540,1160 782,1300 748,1320 540,1440 332,1320 298,1300" fill="#000000" opacity="0.06" filter="url(#shadowBlur)" transform="translate(0, 35)"/>

        <!-- SHAFT INNER FACES -->
        <!-- Floor Base -->
        <polygon points="540,1200 748,1320 540,1440 332,1320" fill="url(#floorGrad)" stroke="#e0e0e0" stroke-width="1" stroke-linejoin="round"/>
        <!-- Left Inner Wall -->
        <polygon points="540,1200 332,1320 332,420 540,300" fill="url(#leftWallGrad)" stroke="#cccccc" stroke-width="1" stroke-linejoin="round"/>
        <!-- Right Inner Wall -->
        <polygon points="540,1200 748,1320 748,420 540,300" fill="url(#rightWallGrad)" stroke="#cccccc" stroke-width="1" stroke-linejoin="round"/>
        <!-- Corner Crease Line -->
        <line x1="540" y1="1200" x2="540" y2="300" stroke="#d0d0d0" stroke-width="2" stroke-linecap="round"/>


        <!-- ================= COMPRESSED AIR VOLUME ================= -->
        <!-- Air Block Gradient Morphing Polygon (Simulating height changing from Z=600 to Z=80) -->
        <!-- Y_top points transition from Y-600 to Y-80 -->
        <path fill="url(#airGrad)" stroke="none">
            <animate attributeName="d" 
                     values="M 540,1440 L 748,1320 L 748,720 L 540,840 L 332,720 L 332,1320 Z;
                             M 540,1440 L 748,1320 L 748,720 L 540,840 L 332,720 L 332,1320 Z;
                             M 540,1440 L 748,1320 L 748,1240 L 540,1360 L 332,1240 L 332,1320 Z;
                             M 540,1440 L 748,1320 L 748,1240 L 540,1360 L 332,1240 L 332,1320 Z;
                             M 540,1440 L 748,1320 L 748,720 L 540,840 L 332,720 L 332,1320 Z;
                             M 540,1440 L 748,1320 L 748,720 L 540,840 L 332,720 L 332,1320 Z" 
                     keyTimes="0; 0.15; 0.45; 0.55; 0.85; 1" 
                     keySplines="0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.6 1; 0 0 1 1" 
                     calcMode="spline" repeatCount="indefinite" dur="6s" />
            <animate attributeName="opacity" 
                     values="0.25; 0.25; 1; 1; 0.25; 0.25" 
                     keyTimes="0; 0.15; 0.45; 0.55; 0.85; 1" 
                     calcMode="spline" keySplines="0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.6 1; 0 0 1 1" 
                     repeatCount="indefinite" dur="6s" />
        </path>

        <!-- Air Pressure Rings (Compressing downwards) -->
        <g stroke="#44B6E5" stroke-width="4" fill="none" filter="url(#glow)">
            <!-- Ring Opacity Animation (Flashes brighter when compressed) -->
            <animate attributeName="stroke-opacity" values="0.2; 0.2; 0.9; 0.9; 0.2; 0.2" keyTimes="0; 0.15; 0.45; 0.55; 0.85; 1" dur="6s" repeatCount="indefinite"/>
            
            <!-- Ring 5 (Highest) -->
            <g>
                <animateTransform attributeName="transform" type="translate" values="0,-500; 0,-500; 0,-70; 0,-70; 0,-500; 0,-500" keyTimes="0; 0.15; 0.45; 0.55; 0.85; 1" keySplines="0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.6 1; 0 0 1 1" calcMode="spline" repeatCount="indefinite" dur="6s"/>
                <polygon points="540,1212 727.2,1320 540,1428 352.8,1320" stroke-linejoin="round"/>
            </g>
            <!-- Ring 4 -->
            <g>
                <animateTransform attributeName="transform" type="translate" values="0,-400; 0,-400; 0,-55; 0,-55; 0,-400; 0,-400" keyTimes="0; 0.15; 0.45; 0.55; 0.85; 1" keySplines="0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.6 1; 0 0 1 1" calcMode="spline" repeatCount="indefinite" dur="6s"/>
                <polygon points="540,1212 727.2,1320 540,1428 352.8,1320" stroke-linejoin="round"/>
            </g>
            <!-- Ring 3 -->
            <g>
                <animateTransform attributeName="transform" type="translate" values="0,-300; 0,-300; 0,-40; 0,-40; 0,-300; 0,-300" keyTimes="0; 0.15; 0.45; 0.55; 0.85; 1" keySplines="0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.6 1; 0 0 1 1" calcMode="spline" repeatCount="indefinite" dur="6s"/>
                <polygon points="540,1212 727.2,1320 540,1428 352.8,1320" stroke-linejoin="round"/>
            </g>
            <!-- Ring 2 -->
            <g>
                <animateTransform attributeName="transform" type="translate" values="0,-200; 0,-200; 0,-25; 0,-25; 0,-200; 0,-200" keyTimes="0; 0.15; 0.45; 0.55; 0.85; 1" keySplines="0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.6 1; 0 0 1 1" calcMode="spline" repeatCount="indefinite" dur="6s"/>
                <polygon points="540,1212 727.2,1320 540,1428 352.8,1320" stroke-linejoin="round"/>
            </g>
            <!-- Ring 1 (Lowest) -->
            <g>
                <animateTransform attributeName="transform" type="translate" values="0,-100; 0,-100; 0,-10; 0,-10; 0,-100; 0,-100" keyTimes="0; 0.15; 0.45; 0.55; 0.85; 1" keySplines="0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.6 1; 0 0 1 1" calcMode="spline" repeatCount="indefinite" dur="6s"/>
                <polygon points="540,1212 727.2,1320 540,1428 352.8,1320" stroke-linejoin="round"/>
            </g>
        </g>


        <!-- ================= ELEVATOR CAR & COMPONENTS ================= -->
        
        <!-- Suspension Cable (Follows elevator top) -->
        <line x1="540" y1="-50" x2="540" y2="480" stroke="#b0b0b0" stroke-width="4" stroke-linecap="round">
            <animate attributeName="y2" values="480; 480; 1000; 1000; 480; 480" keyTimes="0; 0.15; 0.45; 0.55; 0.85; 1" keySplines="0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.6 1; 0 0 1 1" calcMode="spline" repeatCount="indefinite" dur="6s"/>
        </line>

        <!-- Elevator Master Group -->
        <g>
            <!-- Falling Animation -->
            <animateTransform attributeName="transform" type="translate" values="0,-600; 0,-600; 0,-80; 0,-80; 0,-600; 0,-600" keyTimes="0; 0.15; 0.45; 0.55; 0.85; 1" keySplines="0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.6 1; 0 0 1 1" calcMode="spline" repeatCount="indefinite" dur="6s"/>
            
            <!-- Piston Directional Arrows (Glows while pushing down) -->
            <g>
                <animate attributeName="opacity" values="0; 0; 1; 0; 0; 0" keyTimes="0; 0.15; 0.45; 0.55; 0.85; 1" dur="6s" repeatCount="indefinite"/>
                <path d="M 540,1330 L 540,1345 M 530,1338 L 540,1345 L 550,1338" stroke="#44B6E5" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
                <path d="M 540,1355 L 540,1370 M 530,1363 L 540,1370 L 550,1363" stroke="#44B6E5" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
                <path d="M 540,1380 L 540,1395 M 530,1388 L 540,1395 L 550,1388" stroke="#44B6E5" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
            </g>

            <!-- Elevator Drop Shadow in Shaft -->
            <polygon points="540,1220 713.2,1320 540,1420 366.8,1320" fill="#000000" opacity="0.15" filter="url(#shadowBlur)" transform="translate(0, 15)"/>

            <!-- The Glowing "Seal" (Syringe Piston Head Effect) -->
            <polygon points="540,1220 713.2,1320 540,1420 366.8,1320" fill="none" stroke="#44B6E5" stroke-width="10" stroke-linejoin="round" filter="url(#glow)"/>

            <!-- Elevator Faces (Clay Render) -->
            <!-- Base Panel -->
            <polygon points="540,1220 713.2,1320 540,1420 366.8,1320" fill="#e0e0e0" stroke="#cccccc" stroke-width="1" stroke-linejoin="round"/>
            
            <!-- Left Face (Faces Bottom-Left) -->
            <polygon points="366.8,1320 540,1420 540,1180 366.8,1080" fill="url(#elevLeftGrad)" stroke="#dcdcdc" stroke-width="1.5" stroke-linejoin="round"/>
            <!-- Left Face Ribbed Details -->
            <line x1="410" y1="1135" x2="410" y2="1335" stroke="#e0e0e0" stroke-width="3" stroke-linecap="round"/>
            <line x1="453" y1="1160" x2="453" y2="1360" stroke="#e0e0e0" stroke-width="3" stroke-linecap="round"/>
            <line x1="496" y1="1185" x2="496" y2="1385" stroke="#e0e0e0" stroke-width="3" stroke-linecap="round"/>

            <!-- Right Face (Faces Bottom-Right) -->
            <polygon points="713.2,1320 540,1420 540,1180 713.2,1080" fill="url(#elevRightGrad)" stroke="#cfcfcf" stroke-width="1.5" stroke-linejoin="round"/>
            <!-- Right Face Ribbed Details -->
            <line x1="583" y1="1185" x2="583" y2="1385" stroke="#c8c8c8" stroke-width="3" stroke-linecap="round"/>
            <line x1="626" y1="1160" x2="626" y2="1360" stroke="#c8c8c8" stroke-width="3" stroke-linecap="round"/>
            <line x1="670" y1="1135" x2="670" y2="1335" stroke="#c8c8c8" stroke-width="3" stroke-linecap="round"/>

            <!-- Top Face -->
            <polygon points="540,980 713.2,1080 540,1180 366.8,1080" fill="#ffffff" stroke="#e8e8e8" stroke-width="1.5" stroke-linejoin="round"/>

            <!-- Top Motor / Mechanism -->
            <g transform="translate(0, -5)">
                <!-- Motor Shadow -->
                <ellipse cx="540" cy="1080" rx="65" ry="37" fill="#000" opacity="0.08" filter="url(#shadowBlur)" transform="translate(0, 10)"/>
                <!-- Motor Base Cylinder -->
                <ellipse cx="540" cy="1080" rx="60" ry="34.6" fill="#cccccc" />
                <path d="M 480,1080 L 480,1040 A 60 34.6 0 0 0 600,1040 L 600,1080 A 60 34.6 0 0 1 480,1080 Z" fill="#e2e2e2" />
                <ellipse cx="540" cy="1040" rx="60" ry="34.6" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="1"/>
                
                <!-- Inner technical ring -->
                <ellipse cx="540" cy="1040" rx="40" ry="23" fill="#eeeeee" stroke="#cccccc" stroke-width="1"/>
                <ellipse cx="540" cy="1035" rx="30" ry="17.3" fill="#dddddd" />
                
                <!-- Glowing Energy Ring on Motor -->
                <ellipse cx="540" cy="1060" rx="62" ry="36" fill="none" stroke="#44B6E5" stroke-width="3" filter="url(#glow)"/>
            </g>
        </g>

        <!-- ================= SHAFT OUTER WALLS (FRONT FRAME) ================= -->
        <!-- Placed here to naturally occlude the elevator and frame the open shaft beautifully -->
        
        <!-- Left Wall Outer Front Edge -->
        <polygon points="298,400 332,420 332,1320 298,1300" fill="#fcfcfc" stroke="#e8e8e8" stroke-width="1" stroke-linejoin="round"/>
        <!-- Left Wall Top Thickness -->
        <polygon points="332,420 540,300 540,260 298,400" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" stroke-linejoin="round"/>
        
        <!-- Right Wall Outer Front Edge -->
        <polygon points="748,420 782,400 782,1300 748,1320" fill="#f0f0f0" stroke="#dcdcdc" stroke-width="1" stroke-linejoin="round"/>
        <!-- Right Wall Top Thickness -->
        <polygon points="540,300 748,420 782,400 540,260" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" stroke-linejoin="round"/>

        <!-- Crisp Top Border Outline -->
        <polyline points="298,400 540,260 782,400" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="332,420 540,300 748,420" fill="none" stroke="#d0d0d0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    </g>

    <!-- ================= TYPOGRAPHY (BOTTOM) ================= -->
    <g transform="translate(0, 1690)">
        <text x="540" y="0" font-size="38" font-weight="700" fill="#222222" text-anchor="middle" letter-spacing="-0.25">
            But air is compressible so the air beneath
        </text>
        <text x="540" y="55" font-size="38" font-weight="700" fill="#222222" text-anchor="middle" letter-spacing="-0.25">
            got <tspan fill="#44B6E5">squeezed tighter and tighter</tspan>
        </text>
        <text x="540" y="110" font-size="38" font-weight="700" fill="#222222" text-anchor="middle" letter-spacing="-0.25">
            as the elevator fell faster.
        </text>
    </g>

</svg>