<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Animation to MP4 Converter</title>
    <style>
      :root {
        --bg1: #081c24;
        --bg2: #0b2f35;
        --panel: #f2f4f0;
        --ink: #061013;
        --muted: #4a585c;
        --accent: #ff8a00;
        --accent-ink: #1e1200;
        --line: #d6ddd8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at 15% 10%, #1b5660 0%, transparent 45%),
          radial-gradient(circle at 85% 15%, #11444a 0%, transparent 40%),
          linear-gradient(150deg, var(--bg1), var(--bg2));
        padding: 24px;
      }

      .layout {
        max-width: 980px;
        margin: 0 auto;
        display: grid;
        gap: 18px;
      }

      .header {
        color: #e9f4f3;
      }

      .header h1 {
        margin: 0 0 8px;
        font-size: clamp(1.6rem, 4vw, 2.3rem);
        line-height: 1.05;
        letter-spacing: -0.02em;
      }

      .header p {
        margin: 0;
        color: #bee0df;
        max-width: 66ch;
      }

      .panel {
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 18px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        overflow: hidden;
      }

      .panel-inner {
        padding: clamp(16px, 3vw, 28px);
        display: grid;
        gap: 16px;
      }

      .row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      @media (max-width: 720px) {
        .row {
          grid-template-columns: 1fr;
        }
      }

      label {
        font-weight: 600;
        font-size: 0.92rem;
        display: block;
        margin-bottom: 6px;
      }

      input,
      textarea,
      button {
        font: inherit;
      }

      input[type="number"],
      input[type="text"],
      input[type="color"],
      textarea,
      input[type="file"] {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        background: #fff;
      }

      textarea {
        min-height: 220px;
        resize: vertical;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      button {
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 700;
        letter-spacing: 0.02em;
        padding: 10px 18px;
        cursor: pointer;
        transition: transform 120ms ease, filter 120ms ease;
      }

      button:hover {
        filter: brightness(1.05);
        transform: translateY(-1px);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .secondary-btn {
        background: #d8e5e3;
        color: #143035;
      }

      .status {
        font-size: 0.95rem;
        color: var(--muted);
      }

      .hint {
        font-size: 0.87rem;
        color: var(--muted);
      }

      .divider {
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }

      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .toggle input[type="checkbox"] {
        width: 16px;
        height: 16px;
      }

      .text-report {
        display: none;
        border: 1px dashed #adc6c4;
        border-radius: 10px;
        padding: 10px 12px;
        background: #f7fbfb;
        color: #12343a;
        font-size: 0.9rem;
        line-height: 1.35;
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="layout">
      <header class="header">
        <h1>Animation Code to MP4</h1>
        <p>
          Paste SVG animation code (or upload a `.svg` / `.txt` file), tune export settings, and download an MP4.
          This uses headless Chromium + ffmpeg on the server.
        </p>
      </header>

      <section class="panel">
        <form id="convert-form" class="panel-inner">
          <div>
            <label for="animationFile">Animation file (optional if pasting code)</label>
            <input id="animationFile" name="animationFile" type="file" accept=".svg,.txt,.xml,.html" />
          </div>

          <div>
            <label for="animationCode">Animation code</label>
            <textarea
              id="animationCode"
              name="animationCode"
              placeholder="Paste your <svg>...</svg> animation code here"
            ></textarea>
          </div>

          <div class="actions">
            <button id="checkTextBtn" class="secondary-btn" type="button">Check Text in SVG</button>
            <button id="stripTextBtn" class="secondary-btn" type="button">Check + Remove Text</button>
            <label class="toggle" for="stripText">
              <input id="stripText" name="stripText" type="checkbox" value="true" />
              Remove text during conversion
            </label>
          </div>

          <div id="textReport" class="text-report"></div>

          <div class="row">
            <div>
              <label for="width">Width</label>
              <input id="width" name="width" type="number" min="256" max="4096" value="1080" />
            </div>
            <div>
              <label for="height">Height</label>
              <input id="height" name="height" type="number" min="256" max="4096" value="1920" />
            </div>
            <div>
              <label for="durationSec">Duration (seconds)</label>
              <input id="durationSec" name="durationSec" type="number" min="1" max="180" step="0.1" value="6" />
            </div>
            <div>
              <label for="fps">FPS</label>
              <input id="fps" name="fps" type="number" min="1" max="60" value="30" />
            </div>
            <div>
              <label for="crf">Quality (CRF, lower is higher quality)</label>
              <input id="crf" name="crf" type="number" min="12" max="35" value="20" />
            </div>
            <div>
              <label for="backgroundColor">Background color</label>
              <input id="backgroundColor" name="backgroundColor" type="color" value="#ffffff" />
            </div>
          </div>

          <div class="divider row">
            <div>
              <label for="fileName">Output file name</label>
              <input id="fileName" name="fileName" type="text" value="animation.mp4" />
            </div>
            <div class="hint">
              Tip: Keep duration equal to one full animation loop for seamless exports.
            </div>
          </div>

          <div class="actions">
            <button id="submitBtn" type="submit">Convert to MP4</button>
            <span id="status" class="status">Ready.</span>
          </div>
        </form>
      </section>
    </main>

    <script>
      const form = document.getElementById("convert-form");
      const statusEl = document.getElementById("status");
      const submitBtn = document.getElementById("submitBtn");
      const animationCodeEl = document.getElementById("animationCode");
      const animationFileEl = document.getElementById("animationFile");
      const checkTextBtn = document.getElementById("checkTextBtn");
      const stripTextBtn = document.getElementById("stripTextBtn");
      const textReportEl = document.getElementById("textReport");

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.style.color = isError ? "#a21616" : "#4a585c";
      }

      function getDownloadFileName(contentDisposition, fallbackName) {
        if (!contentDisposition) return fallbackName;
        const match = contentDisposition.match(/filename="?([^";]+)"?/i);
        return match ? match[1] : fallbackName;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function extractSvgFromRawInput(rawInput) {
        if (!rawInput || !rawInput.trim()) {
          throw new Error("No animation code to inspect.");
        }

        let candidate = rawInput.trim();
        const fencedMatch = candidate.match(/```(?:svg|xml|html)?\s*([\s\S]*?)```/i);
        if (fencedMatch) {
          candidate = fencedMatch[1].trim();
        }

        const svgMatch = candidate.match(/<svg[\s\S]*<\/svg>/i);
        if (!svgMatch) {
          throw new Error("Input must contain one <svg>...</svg> animation.");
        }

        return svgMatch[0];
      }

      function analyzeSvgText(svgContent, maxSnippets = 8) {
        const blockRegex = /<text\b[^>]*>([\s\S]*?)<\/text>/gi;
        const selfClosingRegex = /<text\b[^>]*\/>/gi;

        const snippets = [];
        let textBlockCount = 0;
        let match;

        while ((match = blockRegex.exec(svgContent)) !== null) {
          textBlockCount += 1;
          const snippet = match[1].replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
          if (snippet && snippets.length < maxSnippets) {
            snippets.push(snippet);
          }
        }

        textBlockCount += (svgContent.match(selfClosingRegex) || []).length;
        return { textBlockCount, snippets };
      }

      function stripSvgText(svgContent) {
        const blockRegex = /<text\b[\s\S]*?<\/text>\s*/gi;
        const selfClosingRegex = /<text\b[^>]*\/>\s*/gi;

        const removedTextBlocks =
          (svgContent.match(blockRegex) || []).length + (svgContent.match(selfClosingRegex) || []).length;

        return {
          svgContent: svgContent.replace(blockRegex, "").replace(selfClosingRegex, ""),
          removedTextBlocks,
        };
      }

      function renderTextReport({ textBlockCount, snippets }, removedTextBlocks = 0) {
        textReportEl.style.display = "block";

        if (!textBlockCount) {
          textReportEl.innerHTML = "No &lt;text&gt; blocks found in this SVG.";
          return;
        }

        const listItems = snippets.map((snippet) => `<li>${escapeHtml(snippet)}</li>`).join("");
        const removedInfo = removedTextBlocks > 0 ? ` Removed ${removedTextBlocks} block(s).` : "";
        textReportEl.innerHTML = `<strong>Found ${textBlockCount} text block(s).</strong>${removedInfo}${
          snippets.length ? `<ul>${listItems}</ul>` : ""
        }`;
      }

      function analyzeCurrentCode() {
        const rawInput = animationCodeEl.value;
        const svgContent = extractSvgFromRawInput(rawInput);
        const report = analyzeSvgText(svgContent);
        return { rawInput, svgContent, report };
      }

      animationFileEl.addEventListener("change", async () => {
        const [file] = animationFileEl.files || [];
        if (!file) return;

        try {
          animationCodeEl.value = await file.text();
          setStatus(`Loaded ${file.name} into editor. You can now check/remove text.`);
        } catch (error) {
          setStatus(error.message || "Failed to load file contents.", true);
        }
      });

      checkTextBtn.addEventListener("click", () => {
        try {
          const { report } = analyzeCurrentCode();
          renderTextReport(report);
          setStatus(
            report.textBlockCount
              ? `Detected ${report.textBlockCount} text block(s).`
              : "No visible SVG text blocks detected."
          );
        } catch (error) {
          setStatus(error.message || "Could not inspect animation code.", true);
        }
      });

      stripTextBtn.addEventListener("click", () => {
        try {
          const { rawInput, svgContent, report } = analyzeCurrentCode();
          if (!report.textBlockCount) {
            renderTextReport(report, 0);
            setStatus("No text blocks found. Nothing was removed.");
            return;
          }

          const stripped = stripSvgText(svgContent);
          const updatedRaw = rawInput.replace(/<svg[\s\S]*<\/svg>/i, stripped.svgContent);
          animationCodeEl.value = updatedRaw;

          renderTextReport(report, stripped.removedTextBlocks);
          setStatus(`Removed ${stripped.removedTextBlocks} text block(s) from the SVG code.`);
        } catch (error) {
          setStatus(error.message || "Could not remove text.", true);
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const data = new FormData(form);
        const fallbackName = data.get("fileName") || "animation.mp4";

        submitBtn.disabled = true;
        checkTextBtn.disabled = true;
        stripTextBtn.disabled = true;
        setStatus("Rendering frames and encoding video. This can take 10-60 seconds...");

        try {
          const response = await fetch("/api/convert", {
            method: "POST",
            body: data,
          });

          if (!response.ok) {
            let errorMessage = `Conversion failed (${response.status})`;
            try {
              const errorBody = await response.json();
              if (errorBody.error) errorMessage = errorBody.error;
            } catch {
              // ignore JSON parse failures
            }
            throw new Error(errorMessage);
          }

          const blob = await response.blob();
          const fileName = getDownloadFileName(response.headers.get("Content-Disposition"), fallbackName);
          const removedTextBlocks = Number.parseInt(response.headers.get("X-Removed-Text-Blocks") || "0", 10);

          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = fileName;
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          URL.revokeObjectURL(url);

          const removedTextMsg = removedTextBlocks > 0 ? ` (removed ${removedTextBlocks} text block(s))` : "";
          setStatus(`Done. Downloaded ${fileName}${removedTextMsg}`);
        } catch (error) {
          setStatus(error.message || "Conversion failed.", true);
        } finally {
          submitBtn.disabled = false;
          checkTextBtn.disabled = false;
          stripTextBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
