<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Animation to MP4 Converter</title>
    <style>
      :root {
        --bg1: #081c24;
        --bg2: #0b2f35;
        --panel: #f2f4f0;
        --ink: #061013;
        --muted: #4a585c;
        --accent: #ff8a00;
        --accent-ink: #1e1200;
        --line: #d6ddd8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at 15% 10%, #1b5660 0%, transparent 45%),
          radial-gradient(circle at 85% 15%, #11444a 0%, transparent 40%),
          linear-gradient(150deg, var(--bg1), var(--bg2));
        padding: 24px;
      }

      .layout {
        max-width: 980px;
        margin: 0 auto;
        display: grid;
        gap: 18px;
      }

      .header {
        color: #e9f4f3;
      }

      .header h1 {
        margin: 0 0 8px;
        font-size: clamp(1.6rem, 4vw, 2.3rem);
        line-height: 1.05;
        letter-spacing: -0.02em;
      }

      .header p {
        margin: 0;
        color: #bee0df;
        max-width: 66ch;
      }

      .panel {
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 18px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        overflow: hidden;
      }

      .panel-inner {
        padding: clamp(16px, 3vw, 28px);
        display: grid;
        gap: 16px;
      }

      .row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      @media (max-width: 720px) {
        .row {
          grid-template-columns: 1fr;
        }
      }

      label {
        font-weight: 600;
        font-size: 0.92rem;
        display: block;
        margin-bottom: 6px;
      }

      input,
      textarea,
      button {
        font: inherit;
      }

      input[type="number"],
      input[type="text"],
      input[type="color"],
      textarea,
      input[type="file"] {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        background: #fff;
      }

      textarea {
        min-height: 220px;
        resize: vertical;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      button {
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 700;
        letter-spacing: 0.02em;
        padding: 10px 18px;
        cursor: pointer;
        transition: transform 120ms ease, filter 120ms ease;
      }

      button:hover {
        filter: brightness(1.05);
        transform: translateY(-1px);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .status {
        font-size: 0.95rem;
        color: var(--muted);
      }

      .hint {
        font-size: 0.87rem;
        color: var(--muted);
      }

      .divider {
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="layout">
      <header class="header">
        <h1>Animation Code to MP4</h1>
        <p>
          Paste SVG animation code (or upload a `.svg` / `.txt` file), tune export settings, and download an MP4.
          This uses headless Chromium + ffmpeg on the server.
        </p>
      </header>

      <section class="panel">
        <form id="convert-form" class="panel-inner">
          <div>
            <label for="animationFile">Animation file (optional if pasting code)</label>
            <input id="animationFile" name="animationFile" type="file" accept=".svg,.txt,.xml,.html" />
          </div>

          <div>
            <label for="animationCode">Animation code</label>
            <textarea
              id="animationCode"
              name="animationCode"
              placeholder="Paste your <svg>...</svg> animation code here"
            ></textarea>
          </div>

          <div class="row">
            <div>
              <label for="width">Width</label>
              <input id="width" name="width" type="number" min="256" max="4096" value="1080" />
            </div>
            <div>
              <label for="height">Height</label>
              <input id="height" name="height" type="number" min="256" max="4096" value="1920" />
            </div>
            <div>
              <label for="durationSec">Duration (seconds)</label>
              <input id="durationSec" name="durationSec" type="number" min="1" max="180" step="0.1" value="6" />
            </div>
            <div>
              <label for="fps">FPS</label>
              <input id="fps" name="fps" type="number" min="1" max="60" value="30" />
            </div>
            <div>
              <label for="crf">Quality (CRF, lower is higher quality)</label>
              <input id="crf" name="crf" type="number" min="12" max="35" value="20" />
            </div>
            <div>
              <label for="backgroundColor">Background color</label>
              <input id="backgroundColor" name="backgroundColor" type="color" value="#ffffff" />
            </div>
          </div>

          <div class="divider row">
            <div>
              <label for="fileName">Output file name</label>
              <input id="fileName" name="fileName" type="text" value="animation.mp4" />
            </div>
            <div class="hint">
              Tip: Keep duration equal to one full animation loop for seamless exports.
            </div>
          </div>

          <div class="actions">
            <button id="submitBtn" type="submit">Convert to MP4</button>
            <span id="status" class="status">Ready.</span>
          </div>
        </form>
      </section>
    </main>

    <script>
      const form = document.getElementById("convert-form");
      const statusEl = document.getElementById("status");
      const submitBtn = document.getElementById("submitBtn");

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.style.color = isError ? "#a21616" : "#4a585c";
      }

      function getDownloadFileName(contentDisposition, fallbackName) {
        if (!contentDisposition) return fallbackName;
        const match = contentDisposition.match(/filename="?([^";]+)"?/i);
        return match ? match[1] : fallbackName;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const data = new FormData(form);
        const fallbackName = data.get("fileName") || "animation.mp4";

        submitBtn.disabled = true;
        setStatus("Rendering frames and encoding video. This can take 10-60 seconds...");

        try {
          const response = await fetch("/api/convert", {
            method: "POST",
            body: data,
          });

          if (!response.ok) {
            let errorMessage = `Conversion failed (${response.status})`;
            try {
              const errorBody = await response.json();
              if (errorBody.error) errorMessage = errorBody.error;
            } catch {
              // ignore JSON parse failures
            }
            throw new Error(errorMessage);
          }

          const blob = await response.blob();
          const fileName = getDownloadFileName(response.headers.get("Content-Disposition"), fallbackName);

          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = fileName;
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          URL.revokeObjectURL(url);

          setStatus(`Done. Downloaded ${fileName}`);
        } catch (error) {
          setStatus(error.message || "Conversion failed.", true);
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
